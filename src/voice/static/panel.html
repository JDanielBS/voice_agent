<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de Voz IPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tokens Nocturne (subconjunto de _ds/.../styles.css) */
  :root{
    --color-bg:#161826; --color-surface:#232532; --color-text:#e9e9ed;
    --color-accent:#9184d9; --color-accent-200:#e7e5fe; --color-accent-300:#d2cefd;
    --color-neutral-200:#e4e7f5; --color-neutral-400:#b2b6ca; --color-neutral-600:#75798c;
    --color-divider:color-mix(in srgb,#e9e9ed 16%,transparent);
    --font-heading:"Inter",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif;
    --radius-md:8px; --radius-lg:14px;
    --sent-neutro:var(--color-neutral-400); --sent-urgente:#ef6a6a;
    --sent-frustrado:#e0a44a; --sent-positivo:#6fcf8e;
    --orb:clamp(150px,25vh,260px);
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;height:100dvh;background:var(--color-bg);color:var(--color-text);
       font-family:var(--font-body);font-size:15px;line-height:1.55;display:flex;overflow:hidden}
  h2{font-family:var(--font-heading);font-weight:500;margin:0}

  /* Scroll discreto: el pulgar sólo aparece al pasar el cursor o al desplazar */
  .scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;
          scrollbar-color:transparent transparent;transition:scrollbar-color .25s ease}
  .scroll:hover,.scroll.scrolling{scrollbar-color:color-mix(in srgb,var(--color-text) 22%,transparent) transparent}
  .scroll::-webkit-scrollbar{width:11px}
  .scroll::-webkit-scrollbar-track{background:transparent}
  .scroll::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;
          border:4px solid transparent;background-clip:content-box;transition:background-color .25s ease}
  .scroll:hover::-webkit-scrollbar-thumb,.scroll.scrolling::-webkit-scrollbar-thumb{
          background:color-mix(in srgb,var(--color-text) 22%,transparent);background-clip:content-box}
  .scroll::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--color-text) 36%,transparent);background-clip:content-box}

  /* Sidebar */
  aside{width:272px;flex:none;display:flex;flex-direction:column;min-height:0;
        border-right:1px solid var(--color-divider)}
  .side-head{padding:30px 22px 14px;flex:none;font-size:11px;letter-spacing:.1em;
             text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 42%,transparent)}
  #history{flex:1;min-height:0;padding:0 14px 24px;display:flex;flex-direction:column;gap:8px;
           scrollbar-gutter:stable}
  .side-empty{padding:0 8px;font-size:13px;line-height:1.5;
              color:color-mix(in srgb,var(--color-text) 32%,transparent)}
  .hitem{display:flex;flex-direction:column;gap:7px;padding:13px 15px;border-radius:var(--radius-md);
         border-left:2px solid var(--color-accent);background:var(--color-surface)}
  .hitem .when{display:flex;align-items:baseline;gap:8px;font-size:12.5px;
               color:color-mix(in srgb,var(--color-text) 55%,transparent);font-variant-numeric:tabular-nums}
  .hitem .live{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;
               letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-200)}
  .hitem .live span{width:6px;height:6px;border-radius:50%;background:var(--color-accent);
                    animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .hitem .prev{font-size:13.5px;line-height:1.5;color:var(--color-text);
               display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .hitem .ans{font-size:12.5px;line-height:1.5;padding-top:6px;
              border-top:1px solid var(--color-divider);
              color:color-mix(in srgb,var(--color-text) 58%,transparent);
              display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .hitem .ans:empty{display:none}

  /* Centro */
  main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
  .title-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;
              padding:clamp(18px,3.4vh,34px) 16px 0;flex:none;text-align:center}
  .title-wrap h2{font-size:clamp(21px,2.4vw,28px);letter-spacing:-.015em}
  .meta{display:flex;align-items:center;gap:10px;min-height:24px}
  #status{font-size:13px;letter-spacing:.06em;color:color-mix(in srgb,var(--color-text) 45%,transparent)}
  #sent{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;
        background:var(--color-surface);color:var(--sent-neutro);transition:opacity .2s ease}
  #sent.hidden{opacity:0;pointer-events:none}

  .orb-wrap{flex:none;padding:clamp(6px,1.4vh,14px) 0 clamp(4px,1vh,8px)}
  #orb{width:var(--orb);height:var(--orb);display:block;overflow:visible;
       transition:width .5s ease,height .5s ease}
  body.in-call{--orb:clamp(118px,17vh,180px)}

  #warn{display:none;max-width:52ch;margin:10px 16px 0;padding:11px 15px;flex:none;
        border:1px solid color-mix(in srgb,var(--sent-frustrado) 45%,transparent);
        border-radius:var(--radius-md);background:color-mix(in srgb,var(--sent-frustrado) 10%,transparent);
        color:var(--color-neutral-200);font-size:13px;line-height:1.55;text-align:center}
  #warn.show{display:block}
  #warn code{font-family:ui-monospace,monospace;font-size:12.5px;
             background:color-mix(in srgb,var(--color-text) 10%,transparent);
             padding:1px 5px;border-radius:4px}
  #callbtn{font-family:var(--font-heading);font-weight:500;font-size:14px;cursor:pointer;
           color:var(--color-accent);background:transparent;border:1px solid var(--color-accent);
           padding:9px 20px;border-radius:999px;flex:none;
           transition:background-color .18s ease,color .18s ease,border-color .18s ease}
  #callbtn:hover{background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
  #callbtn:focus-visible{outline:2px solid var(--color-accent-300);outline-offset:3px}
  #callbtn.active{color:var(--sent-urgente);border-color:var(--sent-urgente)}
  #callbtn.active:hover{background:color-mix(in srgb,var(--sent-urgente) 12%,transparent)}
  #callbtn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--color-neutral-600);
                    color:var(--color-neutral-600)}
  #callbtn:disabled:hover{background:transparent}

  .feed{flex:1;min-height:0;width:100%;display:flex;justify-content:center}
  #transcript{flex:1;min-height:0;max-width:820px;
              padding:clamp(14px,2.6vh,28px) clamp(16px,3vw,40px) 44px;
              display:flex;flex-direction:column;gap:clamp(18px,2.6vh,28px);
              scrollbar-gutter:stable both-edges;
              mask-image:linear-gradient(to bottom,transparent 0,#000 26px)}
  .empty{margin:auto;max-width:34ch;text-align:center;font-size:15px;line-height:1.6;
         color:color-mix(in srgb,var(--color-text) 38%,transparent)}
  .turn{display:flex;flex-direction:column;gap:7px;max-width:min(88%,62ch);
        animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .turn .who{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
  .turn .text{font-size:clamp(16.5px,1.35vw,20px);line-height:1.6;text-wrap:pretty;
              overflow-wrap:anywhere}
  .turn.user .who{color:var(--color-neutral-400)}
  .turn.user .text{color:var(--color-neutral-200)}
  .turn.agent{align-self:flex-end;text-align:right}
  .turn.agent .who{color:var(--color-accent-300)}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
  @media (max-width:880px){
    aside{display:none}
    .turn{max-width:100%}
  }
</style>
</head>
<body>
<aside>
  <div class="side-head">Conversación</div>
  <div id="history" class="scroll">
    <div class="side-empty">Las preguntas de la llamada aparecerán aquí.</div>
  </div>
</aside>
<main>
  <div class="title-wrap">
    <h2>Agente virtual IPS</h2>
    <div class="meta">
      <div id="status">Esperando la llamada</div>
      <div id="sent" class="hidden">neutro</div>
    </div>
  </div>
  <div class="orb-wrap"><svg id="orb" viewBox="0 0 300 300" aria-hidden="true">
    <defs>
      <radialGradient id="orbFill"><stop offset="0%" stop-color="#9184d9" stop-opacity="0.2"/>
        <stop offset="70%" stop-color="#9184d9" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#9184d9" stop-opacity="0"/></radialGradient>
      <filter id="orbBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="orbBlurG" stdDeviation="8"/></filter>
    </defs>
    <path id="orbGlow" fill="#9184d9"/>
    <path id="orbPath" fill="url(#orbFill)" stroke-width="1.5"/>
    <circle id="orbCore" cx="150" cy="150" fill="none" stroke="var(--color-accent)" stroke-width="1"/>
  </svg></div>
  <button id="callbtn">▶ Iniciar llamada</button>
  <div id="warn"></div>
  <div class="feed">
    <div id="transcript" class="scroll">
      <div class="empty">Pulsa «Iniciar llamada» y haz tu pregunta en voz alta.</div>
    </div>
  </div>
</main>
<script>
const SR = 8000;
const btn = document.getElementById("callbtn");
const statusEl = document.getElementById("status");
const sentEl = document.getElementById("sent");
const transcript = document.getElementById("transcript");
const history = document.getElementById("history");
const warnEl = document.getElementById("warn");
const orbPath = document.getElementById("orbPath"), orbGlow = document.getElementById("orbGlow"),
      orbCore = document.getElementById("orbCore"), orbBlurG = document.getElementById("orbBlurG");
let ws, ctx, playCtx, node, stream, playAt = 0, active = false;
let userLevelTime = 0, tick = 0, pendingItem = null;

// Tabla mu-law G.711 (espejo de src/voice/mulaw.py)
const MULAW = (() => {
  const t = new Int16Array(256);
  for (let b = 0; b < 256; b++){
    const u = ~b & 0xFF, sign = u & 0x80, exp = (u >> 4) & 0x07, man = u & 0x0F;
    let s = ((man << 3) + 132) << exp; s -= 132;
    t[b] = sign ? -s : s;
  }
  return t;
})();

// El pulgar del scroll se muestra mientras el usuario desplaza y se apaga al rato
for (const el of document.querySelectorAll(".scroll")){
  let timer;
  el.addEventListener("scroll", () => {
    el.classList.add("scrolling");
    clearTimeout(timer);
    timer = setTimeout(() => el.classList.remove("scrolling"), 900);
  }, {passive:true});
}

function warn(html){ warnEl.innerHTML = html; warnEl.classList.add("show"); }

// getUserMedia solo existe en contexto seguro: localhost, 127.0.0.1 o HTTPS.
// La URL que imprime uvicorn (0.0.0.0) NO lo es, y el navegador deja
// navigator.mediaDevices en undefined sin más explicación.
function micDisponible(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
if (!micDisponible()){
  btn.disabled = true;
  statusEl.textContent = "Micrófono no disponible";
  const host = location.hostname;
  warn(location.protocol === "http:" && host !== "localhost" && host !== "127.0.0.1"
    ? `El navegador bloquea el micrófono en <code>${location.host}</code> porque no es un origen seguro. `
      + `Abre <code>http://localhost:${location.port || 80}</code> (o sirve el panel por HTTPS, p. ej. con ngrok).`
    : "Este navegador no expone <code>navigator.mediaDevices</code>. Prueba con Chrome o Firefox actualizado.");
}

// ── Orbe animado (portado del mockup Nocturne) ───────────────────────────────
const STATUS = {
  idle:"En silencio", user:"Escuchando al usuario", agent:"El agente está respondiendo"
};
function speaker(){
  if (!active) return "off";
  if (playCtx && playAt > playCtx.currentTime + 0.05) return "agent";
  if (performance.now() - userLevelTime < 300) return "user";
  return "idle";
}
function drawOrb(){
  tick++;
  const sp = speaker();
  const agent = sp === "agent", user = sp === "user";
  const c = 150, base = 96, t = tick * 0.09, N = 72, pts = [];
  for (let i = 0; i < N; i++){
    const a = (i / N) * Math.PI * 2; let r = base;
    if (agent) r += 9*Math.sin(3*a+t*2.1) + 6*Math.sin(5*a-t*1.4) + 4.5*Math.sin(8*a+t*3.1) + 3*Math.sin(13*a-t*2.4);
    else if (user) r += 2.2*Math.sin(2*a+t*0.9);
    else r += 1.4*Math.sin(2*a+t*0.5);
    pts.push([c + r*Math.cos(a), c + r*Math.sin(a)]);
  }
  let d = `M ${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`;
  for (let i = 0; i < N; i++){
    const p0 = pts[i], p1 = pts[(i+1)%N];
    d += ` Q ${p0[0].toFixed(2)} ${p0[1].toFixed(2)} ${((p0[0]+p1[0])/2).toFixed(2)} ${((p0[1]+p1[1])/2).toFixed(2)}`;
  }
  d += " Z";
  const breath = 0.5 + 0.5*Math.sin(tick*(agent?0.3:0.1));
  const stroke = agent ? "var(--color-accent)" : user ? "var(--color-neutral-400)" : "var(--color-neutral-600)";
  const glow = agent ? 0.42+0.26*breath : user ? 0.16 : 0.1;
  orbPath.setAttribute("d", d); orbGlow.setAttribute("d", d);
  orbPath.setAttribute("stroke", stroke);
  orbPath.setAttribute("stroke-opacity", agent ? 0.95 : 0.55);
  orbGlow.setAttribute("opacity", glow*0.5);
  orbBlurG.setAttribute("stdDeviation", agent ? 14 : 8);
  orbCore.setAttribute("r", (base*(agent?0.52+0.03*breath:0.5)).toFixed(2));
  orbCore.setAttribute("stroke-opacity", agent ? 0.3 : 0.12);
  if (active) statusEl.textContent = STATUS[sp] || STATUS.idle;
  requestAnimationFrame(drawOrb);
}
requestAnimationFrame(drawOrb);

// ── Transcripción + sidebar ─────────────────────────────────────────────────
function addTurn(role, text){
  const empty = transcript.querySelector(".empty"); if (empty) empty.remove();
  // No pelear con el usuario si subió a leer un turno anterior
  const atBottom = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 80;
  const el = document.createElement("div");
  el.className = "turn " + (role === "user" ? "user" : "agent");
  el.innerHTML = `<span class="who">${role === "user" ? "Usuario" : "Agente"}</span>`;
  const tx = document.createElement("span"); tx.className = "text"; tx.textContent = text;
  el.appendChild(tx);
  transcript.appendChild(el);
  if (atBottom) transcript.scrollTo({top: transcript.scrollHeight, behavior: "smooth"});
}
function addHistory(text){
  const empty = history.querySelector(".side-empty"); if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "hitem";
  const now = new Date().toLocaleTimeString("es-CO", {hour:"2-digit", minute:"2-digit"});
  el.innerHTML = `<div class="when">${now}<span class="live"><span></span>En curso</span></div>`
               + `<div class="prev"></div><div class="ans"></div>`;
  el.querySelector(".prev").textContent = text;
  history.prepend(el);
  history.scrollTop = 0;
  pendingItem = el;
}
function closeHistory(reply){
  if (!pendingItem) return;
  pendingItem.querySelector(".ans").textContent = reply;
  const live = pendingItem.querySelector(".live"); if (live) live.remove();
  pendingItem = null;
}
const SENT = {neutro:"--sent-neutro", urgente:"--sent-urgente", frustrado:"--sent-frustrado", positivo:"--sent-positivo"};
function setSentiment(s){
  sentEl.classList.remove("hidden");
  sentEl.textContent = s || "neutro";
  sentEl.style.color = `var(${SENT[s] || "--sent-neutro"})`;
}

// ── Audio ────────────────────────────────────────────────────────────────────
function playMulaw(buf){
  const u = new Uint8Array(buf);
  const pcm = playCtx.createBuffer(1, u.length, SR);
  const ch = pcm.getChannelData(0);
  for (let i = 0; i < u.length; i++) ch[i] = MULAW[u[i]] / 32768;
  const src = playCtx.createBufferSource(); src.buffer = pcm; src.connect(playCtx.destination);
  const now = playCtx.currentTime; if (playAt < now) playAt = now;
  src.start(playAt); playAt += pcm.duration;
}
function downsample(f32, inRate){
  const ratio = inRate / SR, outLen = Math.floor(f32.length / ratio);
  const out = new Int16Array(outLen); let sum = 0;
  for (let i = 0; i < outLen; i++){
    const v = f32[Math.floor(i * ratio)];
    out[i] = Math.max(-1, Math.min(1, v)) * 32767;
    sum += v * v;
  }
  if (Math.sqrt(sum / outLen) > 0.02) userLevelTime = performance.now();  // ilumina el orbe
  return out;
}

async function start(){
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${protocol}//${location.host}/demo`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = e => {
    if (typeof e.data === "string"){
      const m = JSON.parse(e.data);
      if (m.role === "user") addHistory(m.text);
      addTurn(m.role, m.text);
      if (m.role === "agent"){
        closeHistory(m.text); setSentiment(m.sentimiento);
      }
    } else playMulaw(e.data);
  };
  ws.onclose = () => stop();

  stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  ctx = new AudioContext();
  playCtx = new AudioContext({sampleRate: SR});
  // Autoplay: el contexto puede nacer suspendido aunque venga de un clic.
  await playCtx.resume(); await ctx.resume();
  const srcNode = ctx.createMediaStreamSource(stream);
  // ponytail: ScriptProcessorNode deprecado; migrar a AudioWorklet si da glitches.
  node = ctx.createScriptProcessor(4096, 1, 1);
  node.onaudioprocess = ev => {
    if (ws.readyState !== WebSocket.OPEN) return;
    ws.send(downsample(ev.inputBuffer.getChannelData(0), ctx.sampleRate).buffer);
  };
  // El micrófono no se reproduce por los parlantes (ganancia 0), solo mantiene
  // vivo el grafo de audio para que dispare onaudioprocess.
  const mute = ctx.createGain(); mute.gain.value = 0;
  srcNode.connect(node); node.connect(mute); mute.connect(ctx.destination);

  active = true;
  btn.textContent = "■ Colgar"; btn.classList.add("active");
  document.body.classList.add("in-call");
}

function stop(){
  if (!active) return;
  active = false;
  if (node) node.disconnect();
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close(); if (playCtx) playCtx.close();
  if (ws && ws.readyState === WebSocket.OPEN) ws.close();
  playAt = 0;
  closeHistory("Llamada finalizada.");
  btn.textContent = "▶ Iniciar llamada"; btn.classList.remove("active");
  document.body.classList.remove("in-call");
  statusEl.textContent = "Esperando la llamada";
}

const MIC_ERR = {
  NotAllowedError: "Diste «bloquear» al permiso del micrófono. Habilítalo en el candado de la barra de direcciones y vuelve a intentar.",
  NotFoundError: "No encontré ningún micrófono conectado.",
  NotReadableError: "El micrófono está ocupado por otra aplicación.",
};
btn.onclick = () => {
  if (active) return stop();
  warnEl.classList.remove("show");
  start().catch(e => {
    stop();
    warn(MIC_ERR[e.name] || `No pude abrir el micrófono: ${e.message || e}`);
  });
};
</script>
</body>
</html>
