services:
  - type: web
    name: voice-agent-ips
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.voice.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
